<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Jabiru</title>
<link rel="icon" type="image/png" href="/icons/favicon.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Newsreader:opsz,wght@6..72,300;6..72,400&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="styles.css"/>
<script>
  // Apply the saved theme before the page paints, so there is no flash.
  (function () {
    var saved = null;
    try { saved = localStorage.getItem('ef-theme'); } catch (e) {}
    var dark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.setAttribute('data-theme', saved || (dark ? 'dark' : 'light'));
  })();
</script>
</head>
<body>

<nav class="topnav">
  <div class="topnav-inner">
    <button class="menu-btn" onclick="toggleSidebar()" aria-label="Open categories">&#9776;</button>
    <a class="nav-brand use-wordmark" href="/" title="Home">
      <div class="nav-logo-wrap is-img" id="logo-wrap">
        <span id="logo-icon-emoji" hidden>🗂</span>
        <img id="logo-icon-img" src="icons/jabiru-mark.png" alt=""/>
      </div>
      <span class="nav-wordmark" aria-hidden="true"></span>
      <span class="nav-brand-name" id="logo-text">Jabiru</span>
    </a>

    <div class="nav-search-wrap">
      <span class="nav-search-icon">⌕</span>
      <input type="text" id="search" placeholder="Search..." oninput="render()"/>
      <button type="button" class="filter-btn" id="filter-btn" aria-expanded="false" aria-controls="filter-panel" title="Filters">
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12M20 18h0" stroke="currentColor" stroke-width="2" stroke-linecap="round" fill="none"/><circle cx="16" cy="6" r="2" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="10" cy="12" r="2" stroke="currentColor" stroke-width="2" fill="none"/><circle cx="18" cy="18" r="2" stroke="currentColor" stroke-width="2" fill="none"/></svg>
        <span class="filter-btn-label">Filters</span><span class="filter-badge" id="filter-badge" hidden></span>
      </button>
      <div class="filter-panel" id="filter-panel" role="dialog" aria-label="Filter apps" hidden></div>
    </div>

    <div class="nav-right">
      <button class="theme-toggle" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle dark/light mode">
        <span class="theme-icon">&#9790;</span>
      </button>
    </div>
  </div>
</nav>

<div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>

<div class="page-shell">
  <div class="main-layout">
    <nav class="sidebar" id="sidebar" aria-label="Categories"></nav>
    <main class="content-area">
      <div id="grid"></div>
    </main>
  </div>
</div>

<script>
var site = { brand: {}, catOrder: [], apps: [] };
var activeTab = 'All';

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
}
function isImage(icon) { return /^(data:|https?:|icons\/)/.test(icon || ''); }

// Categories in admin-defined order, then any others alphabetically.
function categories() {
  var used = [];
  site.apps.forEach(function (a) { if (used.indexOf(a.cat) < 0) used.push(a.cat); });
  var ordered = site.catOrder.filter(function (c) { return used.indexOf(c) >= 0; });
  var rest = used.filter(function (c) { return ordered.indexOf(c) < 0; }).sort();
  return ordered.concat(rest);
}

// Filters: tags live in data/tags.json (app id -> tags), grouped for the filter panel.
var tagData = { groups: [], apps: {} };
var activeTags = [];
function tagsOf(a) { return tagData.apps[String(a.id)] || []; }
function hasAllTags(a) {
  var t = tagsOf(a);
  return activeTags.every(function (x) { return t.indexOf(x) >= 0; });
}

function filteredApps() {
  var q = document.getElementById('search').value.trim().toLowerCase();
  return site.apps.filter(function (a) {
    var inCat = activeTab === 'All' || a.cat === activeTab;
    var inQ = !q || [a.name, a.desc, a.cat].concat(tagsOf(a)).join(' ').toLowerCase().indexOf(q) >= 0;
    return inCat && inQ && hasAllTags(a);
  });
}

function renderFilterPanel() {
  var inScope = site.apps.filter(function (a) { return activeTab === 'All' || a.cat === activeTab; });
  var out = '<div class="filter-panel-head"><span class="filter-panel-title">Filter apps</span>' +
    (activeTags.length ? '<button type="button" class="filter-clear" data-clear>Clear all</button>' : '') + '</div>';
  tagData.groups.forEach(function (g) {
    var chips = g.tags.map(function (t) {
      var on = activeTags.indexOf(t) >= 0;
      // How many apps you'd see if you added this filter to the ones already on.
      var n = inScope.filter(function (a) { var at = tagsOf(a); return at.indexOf(t) >= 0 && hasAllTags(a); }).length;
      return '<button type="button" class="filter-chip' + (on ? ' on' : '') + '" data-tag="' + esc(t) + '" aria-pressed="' + on + '"' +
        (!on && !n ? ' disabled' : '') + '>' + esc(t) + '<span class="filter-chip-n">' + n + '</span></button>';
    }).join('');
    out += '<div class="filter-group"><div class="filter-group-name">' + esc(g.name) + '</div>' +
      (g.note ? '<div class="filter-group-note">' + esc(g.note) + '</div>' : '') +
      '<div class="filter-chips">' + chips + '</div></div>';
  });
  document.getElementById('filter-panel').innerHTML = out;
  var badge = document.getElementById('filter-badge');
  badge.hidden = !activeTags.length; badge.textContent = activeTags.length;
  document.getElementById('filter-btn').classList.toggle('active', activeTags.length > 0);
}

function activeFilterRow() {
  if (!activeTags.length) return '';
  return '<div class="active-filters">' + activeTags.map(function (t) {
    return '<button type="button" class="active-filter" data-untag="' + esc(t) + '" aria-label="Remove ' + esc(t) + ' filter">' +
      esc(t) + '<span aria-hidden="true">&times;</span></button>';
  }).join('') + '<button type="button" class="active-filter-clear" data-clear>Clear filters</button></div>';
}

function toggleTag(t) {
  var i = activeTags.indexOf(t);
  if (i >= 0) activeTags.splice(i, 1); else activeTags.push(t);
  syncTagsToUrl(); render();
}
function clearTags() { activeTags = []; syncTagsToUrl(); render(); }
// Filters ride in the query string (/app?tags=Hyperliquid), so filtered views can be shared.
function syncTagsToUrl() {
  var p = new URLSearchParams(location.search);
  if (activeTags.length) p.set('tags', activeTags.join(',')); else p.delete('tags');
  var s = p.toString();
  history.replaceState(history.state, '', location.pathname + (s ? '?' + s : '') + location.hash);
}
function tagsFromUrl() {
  var raw = new URLSearchParams(location.search).get('tags') || '';
  var known = [];
  tagData.groups.forEach(function (g) { known = known.concat(g.tags); });
  return raw.split(',').map(function (s) { return s.trim(); }).filter(function (t) { return known.indexOf(t) >= 0; });
}
function setFilterPanel(open) {
  document.getElementById('filter-panel').hidden = !open;
  document.getElementById('filter-btn').setAttribute('aria-expanded', open);
}

// Layout follows the original Claude web version: "Browse" sidebar, cards with the
// category as a small tag at the bottom; "All tools" is grouped into category sections.
function renderSidebar() {
  var out = '<div class="sidebar-label">Browse</div>';
  out += '<button class="sidebar-all-btn' + (activeTab === 'All' ? ' active' : '') + '" data-cat="All"><span>All tools</span></button>';
  categories().forEach(function (c) {
    out += '<div class="cat-item"><button class="cat-trigger' + (activeTab === c ? ' active' : '') + '" data-cat="' + esc(c) + '">' +
      '<span class="cat-name">' + esc(c) + '</span></button></div>';
  });
  document.getElementById('sidebar').innerHTML = out;
}

function buildCard(a, i) {
  var bg = 'background:rgba(79,142,247,0.1)';
  var icon = isImage(a.icon)
    ? '<div class="card-icon" style="' + bg + ';padding:0;overflow:hidden"><img src="' + esc(a.icon) + '" alt="" loading="lazy"/></div>'
    : '<div class="card-icon" style="' + bg + '">' + esc(a.icon || '🔗') + '</div>';
  return '<div class="card" tabindex="0" data-id="' + esc(a.id) + '" style="animation-delay:' + Math.min(i * 0.05, 0.6).toFixed(2) + 's">' +
    '<div class="card-top">' + icon + '</div>' +
    '<div class="card-title">' + esc(a.name) + '<span class="card-arrow">&#8599;</span></div>' +
    '<div class="card-desc">' + esc(a.desc) + '</div></div>';
}

// One line per folder. A category without an entry here gets a generic line.
var CAT_DESC = {
  'Productivity': 'Everyday tools for writing, planning, coding and staying in touch.',
  'Dex Aggregator': 'Route swaps across DEXs for the best price.',
  'Prediction Market': 'Trade on the outcome of real-world events.',
  'Research Blogs': 'Reports, deep dives and long-form crypto research.',
  'News': 'Headlines, alerts and breaking stories from across crypto.',
  'Data & Analytics': 'Charts, dashboards, token data and on-chain analytics.',
  'Security': 'Scanners, revokers and monitors that keep your funds safe.',
  'OSINT': 'Background checks on teams, founders and scammers: identities, leaks and archives.',
  'Wallet': 'Store, send and manage your crypto.',
  'Bridges': 'Move assets between chains.',
  'Perp Dex': 'Trade perpetual futures with leverage on-chain.',
  'Social Analytics': 'Track sentiment, mindshare and crypto social activity.',
  'Bounty': 'Earn from audits, bug bounties, tasks and quests.',
  'Trenches': 'Fast tools for finding and trading new tokens.',
  'DeFi': 'Lend, borrow, stake, swap and earn yield.',
  'NFTs': 'Mint, collect and trade digital collectibles.',
  'AI Agents': 'Autonomous agents and AI-powered crypto tools.',
  'CEX': 'Centralised exchanges for buying and trading crypto.',
  'Educational': 'Learn crypto, from the basics to building.',
  'Launchpad': 'Discover and back new token launches.',
  'Ramps': 'Move between cash and crypto.',
  'Utilities': 'Handy tools for everyday on-chain tasks.',
  'Chains': 'Blockchains and L2 networks to build and transact on.'
};
function catDesc(c) { return CAT_DESC[c] || 'A collection of ' + c + ' tools.'; }
function appCount(n) { return n + (n === 1 ? ' app' : ' apps'); }
function appsIn(cat) { return site.apps.filter(function (a) { return a.cat === cat; }); }

var PREVIEW_MAX = 4;
function buildFolder(cat, i) {
  var apps = appsIn(cat);
  var shown = apps.slice(0, PREVIEW_MAX);
  var more = apps.length - shown.length;
  var peek = shown.map(function (a) {
    return '<span class="folder-app">' + (isImage(a.icon)
      ? '<img src="' + esc(a.icon) + '" alt="" loading="lazy"/>'
      : '<span class="folder-app-emoji">' + esc(a.icon || '🔗') + '</span>') + '</span>';
  }).join('') + (more > 0 ? '<span class="folder-app folder-more">+' + more + '</span>' : '');
  return '<button class="folder" data-folder="' + esc(cat) + '" style="--i:' + i + '" aria-label="Open ' + esc(cat) + ' folder, ' + appCount(apps.length) + '">' +
    '<span class="folder-back" aria-hidden="true"></span>' +
    '<span class="folder-peek" aria-hidden="true">' + peek + '</span>' +
    '<span class="folder-front">' +
      '<span class="folder-name">' + esc(cat) + '</span>' +
      '<span class="folder-desc">' + esc(catDesc(cat)) + '</span>' +
      '<span class="folder-meta"><span class="folder-count">' + appCount(apps.length) + '</span>' +
      '<span class="folder-open">Open <span aria-hidden="true">&rarr;</span></span></span>' +
    '</span></button>';
}

var FOLDER_ICON = '<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.3l2 2h8.7A1.5 1.5 0 0 1 21 8.5v9A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z" fill="currentColor"/></svg>';

var lastView = null;
function render() {
  renderSidebar();
  renderFilterPanel();
  var cats = categories();
  var q = document.getElementById('search').value.trim();
  var filtering = !!(q || activeTags.length);
  var label = q ? '“' + q + '”' : activeTags.join(' + ');
  if (q && activeTags.length) label += ' in ' + activeTags.join(' + ');
  var search = document.getElementById('search');
  search.placeholder = activeTab === 'All' ? 'Search all tools...' : 'Search in ' + activeTab + '...';
  // Keep apps in category order, as the sidebar lists them.
  var list = filteredApps().sort(function (x, y) { return cats.indexOf(x.cat) - cats.indexOf(y.cat); });
  var grid = document.getElementById('grid');
  var out;

  if (activeTab !== 'All') {
    // Opened folder: header with a way back, then the folder's apps.
    var total = appsIn(activeTab).length;
    out = '<header class="lib-head folder-head">' +
      '<button class="folder-backlink" data-folder="All"><span aria-hidden="true">&larr;</span> All tools</button>' +
      '<div class="folder-head-row"><span class="folder-head-icon">' + FOLDER_ICON + '</span>' +
      '<h1 class="lib-title">' + esc(activeTab) + '</h1><span class="lib-count">' + appCount(total) + '</span></div>' +
      '<p class="lib-sub">' + esc(catDesc(activeTab)) + '</p></header>' + activeFilterRow();
    out += list.length
      ? '<div class="grid">' + list.map(buildCard).join('') + '</div>'
      : emptyState('Nothing in ' + activeTab + ' matches ' + label, 'Try another word, remove a filter, or go back to search all tools.');
  } else if (filtering) {
    // Searching or filtering from All tools: results from every folder, grouped by folder.
    out = '<header class="lib-head"><h1 class="lib-title">Results for ' + esc(label) + '</h1>' +
      '<p class="lib-sub">' + (list.length ? appCount(list.length) + ' across all folders' : 'Searched all folders') + '</p></header>' + activeFilterRow();
    out += list.length ? cats.map(function (cat) {
      var apps = list.filter(function (a) { return a.cat === cat; });
      if (!apps.length) return '';
      return '<section class="cat-section"><div class="cat-section-hdr">' +
        '<span class="cat-section-hdr-name">' + esc(cat) + '</span>' +
        '<button class="cat-section-open" data-folder="' + esc(cat) + '">Open folder &rarr;</button></div>' +
        '<div class="grid">' + apps.map(buildCard).join('') + '</div></section>';
    }).join('') : emptyState('No apps found', activeTags.length ? 'Try removing a filter.' : 'Try a different name or keyword.');
  } else {
    // All tools: the folder library.
    out = '<header class="lib-head"><h1 class="lib-title">All tools</h1>' +
      '<p class="lib-sub">Every app on Jabiru, sorted into folders. Open one to explore.</p></header>' +
      '<div class="folder-grid">' + cats.map(buildFolder).join('') + '</div>';
  }
  grid.className = '';
  grid.innerHTML = out;

  // Play the entrance animation only when the view changes, not on every keystroke.
  var view = activeTab + (activeTab === 'All' && filtering ? ':search' : '');
  if (view !== lastView) {
    grid.classList.remove('view-enter'); void grid.offsetWidth; grid.classList.add('view-enter');
    lastView = view;
  }
}

function emptyState(msg, sub) {
  return '<div class="empty-state"><div class="empty-state-icon">🔍</div>' +
    '<div class="empty-state-msg">' + esc(msg) + '</div><div class="empty-state-sub">' + esc(sub) + '</div></div>';
}

// The open folder lives in the URL hash (/app#DeFi), so Back and shared links work.
function tabFromHash() {
  var h = '';
  try { h = decodeURIComponent(location.hash.slice(1)); } catch (e) {}
  return categories().indexOf(h) >= 0 ? h : 'All';
}
function setTab(cat) {
  if (cat !== activeTab) {
    history.pushState(null, '', cat === 'All' ? location.pathname + location.search : '#' + encodeURIComponent(cat));
    document.getElementById('search').value = '';
  }
  activeTab = cat; closeSidebar(); render(); window.scrollTo(0, 0);
}
window.addEventListener('popstate', function () {
  activeTab = tabFromHash(); document.getElementById('search').value = '';
  render(); window.scrollTo(0, 0);
});

function applyBrand() {
  var b = site.brand || {};
  var name = b.name || 'Jabiru';
  document.getElementById('logo-text').textContent = name;
  document.title = name;
  var img = document.getElementById('logo-icon-img');
  var emoji = document.getElementById('logo-icon-emoji');
  if (b.logoImage) { img.src = b.logoImage; img.hidden = false; emoji.hidden = true; }
  else { emoji.textContent = b.logoEmoji || '🗂'; emoji.hidden = false; img.hidden = true; }
  document.getElementById('logo-wrap').classList.toggle('is-img', !!b.logoImage);
  // Show the drawn wordmark while the site is called Jabiru; otherwise show the name as text.
  document.querySelector('.nav-brand').classList.toggle('use-wordmark', name.trim().toLowerCase() === 'jabiru');
}

function launchApp(id) {
  var app = site.apps.find(function (a) { return String(a.id) === String(id); });
  if (app) window.open(app.url, '_blank', 'noopener,noreferrer');
}

document.getElementById('sidebar').addEventListener('click', function (e) {
  var btn = e.target.closest('[data-cat]');
  if (btn) setTab(btn.getAttribute('data-cat'));
});
document.getElementById('filter-btn').addEventListener('click', function (e) {
  e.stopPropagation();
  setFilterPanel(document.getElementById('filter-panel').hidden);
});
document.getElementById('filter-panel').addEventListener('click', function (e) {
  e.stopPropagation();
  var chip = e.target.closest('[data-tag]');
  if (chip) { toggleTag(chip.getAttribute('data-tag')); return; }
  if (e.target.closest('[data-clear]')) clearTags();
});
document.addEventListener('click', function (e) {
  if (!e.target.closest('.nav-search-wrap')) setFilterPanel(false);
});
document.addEventListener('keydown', function (e) {
  if (e.key === 'Escape' && !document.getElementById('filter-panel').hidden) {
    setFilterPanel(false); document.getElementById('filter-btn').focus();
  }
});
document.getElementById('grid').addEventListener('click', function (e) {
  var untag = e.target.closest('[data-untag]');
  if (untag) { toggleTag(untag.getAttribute('data-untag')); return; }
  if (e.target.closest('[data-clear]')) { clearTags(); return; }
  var folder = e.target.closest('[data-folder]');
  if (folder) { setTab(folder.getAttribute('data-folder')); return; }
  var card = e.target.closest('.card');
  if (card) launchApp(card.getAttribute('data-id'));
});
document.getElementById('grid').addEventListener('keydown', function (e) {
  var card = e.target.closest('.card');
  if (card && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); launchApp(card.getAttribute('data-id')); }
});
document.addEventListener('contextmenu', function (e) { if (e.target.closest('.card')) e.preventDefault(); });
document.addEventListener('auxclick', function (e) { if (e.button === 1 && e.target.closest('.card')) e.preventDefault(); });
document.addEventListener('dragstart', function (e) { if (e.target.closest('.card')) e.preventDefault(); });

function toggleSidebar() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('sidebar-overlay').classList.toggle('open');
}
function closeSidebar() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('sidebar-overlay').classList.remove('open');
}

function updateThemeIcon() {
  var dark = document.documentElement.getAttribute('data-theme') === 'dark';
  document.querySelector('.theme-icon').textContent = dark ? '☀' : '☾';
}
function toggleTheme() {
  var root = document.documentElement;
  var next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  root.setAttribute('data-theme', next);
  try { localStorage.setItem('ef-theme', next); } catch (e) {}
  updateThemeIcon();
}
updateThemeIcon();

// Tags are optional: if they fail to load, search and folders still work.
var tagsReady = fetch('data/tags.json', { cache: 'no-cache' })
  .then(function (r) { return r.ok ? r.json() : null; })
  .then(function (t) { if (t && t.groups) tagData = t; })
  .catch(function () {});
fetch('data/site.json', { cache: 'no-cache' })
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(function (data) {
    site = data; applyBrand(); activeTab = tabFromHash();
    return tagsReady.then(function () { activeTags = tagsFromUrl(); render(); });
  })
  .catch(function () {
    document.getElementById('grid').innerHTML =
      '<div class="empty-state"><div class="empty-state-msg">Could not load apps</div>' +
      '<div class="empty-state-sub">Please refresh the page.</div></div>';
  });
</script>
</body>
</html>
